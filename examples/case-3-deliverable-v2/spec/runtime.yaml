schemaVersion: "1.0"
profile: x-invoice-extraction-agent-v1
entrypoint: extract
determinism:
  temperature: 0
  retries: 0
  clock_dependence: none
model_endpoint:
  configured_by: buyer
  call_home: none
harness:
  command: python -m harness.score --set heldout
  emits: per-field accuracy, invoice_total accuracy, determinism diff
currency_handling:
  document_level: false
  per_line_override: true       # v2 fix: currency resolved per line item
  missing_rate_policy: flag_needs_review_and_null_total
